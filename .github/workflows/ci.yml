name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: peblo_ci
          POSTGRES_USER: peblo
          POSTGRES_PASSWORD: peblo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peblo -d peblo_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg2://peblo:peblo@localhost:5432/peblo_ci
      JWT_SECRET: ci-secret
      STORAGE_LOCAL_PATH: ${{ github.workspace }}/.ci-storage
      STORAGE_PUBLIC_BASE_URL: http://localhost:8000/storage
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Lint backend
        run: python -m ruff check app tests
      - name: Run migrations
        run: alembic upgrade head
      - name: Seed database
        run: python ../scripts/seed.py
      - name: Run backend tests
        run: pytest

  frontends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            cms/package-lock.json
            viewer/package-lock.json
      - name: Install CMS dependencies
        working-directory: cms
        run: npm ci
      - name: Build CMS
        working-directory: cms
        env:
          VITE_API_BASE_URL: http://localhost:8000
        run: npm run build
      - name: Install viewer dependencies
        working-directory: viewer
        run: npm ci
      - name: Build viewer
        working-directory: viewer
        env:
          VITE_API_BASE_URL: http://localhost:8000
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontends]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t peblo-tv-mini-api ./backend
      - name: Build CMS image
        run: docker build -t peblo-tv-mini-cms ./cms
      - name: Build viewer image
        run: docker build -t peblo-tv-mini-viewer ./viewer
      - name: Deploy plan
        run: |
          echo "Build -> push images -> run alembic upgrade head -> rolling restart api/cms/viewer -> smoke-check /health and /catalog"
          echo "This stays manual because no real cloud target or registry credentials are part of the take-home."